[discord]
# Discord Bot Token (required for bot functionality)
# Get this from https://discord.com/developers/applications
bot_token = YOUR_BOT_TOKEN_HERE

# Discord Webhook URL (for notifications only, alternative to bot)
# Create in Discord: Server Settings > Integrations > Webhooks
webhook_url = YOUR_WEBHOOK_URL_HERE

# Channel ID where the bot will send notifications and accept commands
channel_id = YOUR_CHANNEL_ID_HERE

# Role ID that can execute admin commands (optional, leave empty for any user)
admin_role_id =

# Guild/Server ID (required for slash commands)
guild_id = YOUR_GUILD_ID_HERE

[fail2ban]
# Path to fail2ban-client
fail2ban_client = /usr/bin/fail2ban-client

# Jails to monitor (comma-separated)
# Leave empty to monitor all jails
monitored_jails = sshd,arma-reforger

# Log file path for the bot
log_file = /var/log/fail2ban-discord.log

[notifications]
# Enable/disable different notification types
notify_on_ban = true
notify_on_unban = true
notify_on_start = true
notify_on_stop = true

# Include GeoIP information in ban notifications (requires geoip2 package)
include_geoip = true

# Embed color (hex without #)
ban_color = ff0000
unban_color = 00ff00
info_color = 0099ff

[arma_reforger]
# Path to Arma Reforger server logs
# For Docker: typically mounted volume path
log_path = /var/log/arma-reforger/

# Container name pattern (for Docker log access)
container_pattern = arma-reforger-*

# Ban thresholds
max_retry = 5
find_time = 600
ban_time = 3600

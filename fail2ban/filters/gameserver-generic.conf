# Fail2Ban Filter for Generic Game Servers
# Place this file in /etc/fail2ban/filter.d/gameserver-generic.conf
#
# A generic filter that catches common malicious patterns for game servers.
# Can be used as a base for custom game server filters.

[Definition]

# Option: failregex
# Notes.: Regex patterns for common game server security events
#
failregex = ^.*<HOST>.*(?:banned|kicked|rejected).*$
            ^.*<HOST>.*(?:failed|invalid).*(?:auth|login|connect|password|token).*$
            ^.*<HOST>.*(?:too many|rate limit|flood|spam).*$
            ^.*<HOST>.*(?:cheat|hack|exploit|violation).*$
            ^.*<HOST>.*(?:malformed|invalid|bad).*(?:packet|request|data).*$
            ^.*(?:banned|kicked|rejected).*<HOST>.*$
            ^.*(?:RCON|rcon|console).*(?:fail|invalid|reject).*<HOST>.*$
            ^.*<HOST>.*(?:connection refused|access denied).*$
            ^.*(?:BattlEye|EAC|VAC|PunkBuster).*<HOST>.*(?:kick|ban|detect).*$

# Option: ignoreregex
# Notes.: Patterns to ignore
#
ignoreregex = ^.*<HOST>.*(?:disconnect|timeout|leave|quit).*graceful.*$
              ^.*<HOST>.*(?:connected|joined|authenticated).*success.*$

# Option: maxlines
# Notes.: Number of lines to buffer
#
maxlines = 1

# Option: datepattern
# Notes.: Common log timestamp patterns
#
datepattern = %%Y-%%m-%%d %%H:%%M:%%S
              %%Y/%%m/%%d %%H:%%M:%%S
              %%d/%%b/%%Y:%%H:%%M:%%S
              \[%%Y-%%m-%%d %%H:%%M:%%S\]
              %%b %%d %%H:%%M:%%S
              {^LN-BEG}

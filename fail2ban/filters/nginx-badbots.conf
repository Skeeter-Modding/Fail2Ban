# Fail2Ban Filter for Nginx Bad Bots and Scanners
# Place this file in /etc/fail2ban/filter.d/nginx-badbots.conf
#
# Catches known malicious bots, vulnerability scanners, and suspicious requests.

[Definition]

# Option: badbots
# Notes.: List of known bad bot user agents
#
badbotscustom = EmailCollector|WebEMailExtrac|TrackBack/1\.02|sogou|(?:Mozilla/\d+\.\d+ )?Jorgee
badbots = Havij|sqlmap|Nikto|nmap|masscan|ZmEu|paros|zmeu|libwww-perl|lwp-trivial|HTTrack|clshttp|harvest|extract|grab|miner|python-requests/|curl/|wget/|Go-http-client|Scrapy|Java/|Apache-HttpClient|<badbotscustom>

# Option: failregex
# Notes.: Regex to match bad bot requests
#
failregex = ^<HOST> -.*"(GET|POST|HEAD).*HTTP.*".*".*(?i)(<badbots>).*"$
            ^<HOST> -.*"(GET|POST).*(?:/wp-login\.php|/xmlrpc\.php|/wp-admin|/administrator|/phpmyadmin|/pma|/myadmin|/mysql|/mysqladmin|/wp-content/plugins|/wp-includes).*"
            ^<HOST> -.*"(GET|POST).*/\.env.*"
            ^<HOST> -.*"(GET|POST).*/\.git.*"
            ^<HOST> -.*"(GET|POST).*/config\..*"
            ^<HOST> -.*"(GET|POST).*/backup.*"
            ^<HOST> -.*"(GET|POST).*/shell.*"
            ^<HOST> -.*"(GET|POST).*/eval-stdin.*"
            ^<HOST> -.*"(GET|POST|HEAD).*" 444
            ^<HOST> -.*"\x.*"

# Option: ignoreregex
# Notes.: Regex to ignore
#
ignoreregex =

# Option: datepattern
# Notes.: Pattern for log timestamp
#
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z

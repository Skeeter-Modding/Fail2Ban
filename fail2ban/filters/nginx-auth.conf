# Fail2Ban Filter for Nginx HTTP Authentication Failures
# Place this file in /etc/fail2ban/filter.d/nginx-auth.conf
#
# Catches failed HTTP basic authentication attempts.

[Definition]

# Option: failregex
# Notes.: Regex to match failed authentication attempts
#
failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS).*" 401
            ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS).*" 403
            no user/password was provided for basic authentication.*client: <HOST>
            user .* was not found in .*, client: <HOST>
            user .* password mismatch, client: <HOST>

# Option: ignoreregex
# Notes.: Regex to ignore
#
ignoreregex =

# Option: datepattern
# Notes.: Pattern for log timestamp
#
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z
              %%Y/%%m/%%d %%H:%%M:%%S

# Fail2Ban Filter for Arma Reforger Dedicated Server
# Place this file in /etc/fail2ban/filter.d/arma-reforger.conf
#
# This filter catches malicious activity patterns from Arma Reforger server logs.
# Log format: HH:MM:SS.mmm CATEGORY (LEVEL): message
#
# Example log lines:
# 19:36:12.310 RPL : ServerImpl event: authenticating (identity=0x00000023, address=77.118.64.190:52115)
# 19:36:12.577 DEFAULT : BattlEye Server: 'Player #100 Domi_papi (77.118.64.190:52115) connected'

[Definition]

# Option: prefregex
# Notes.: Prefix regex to match the timestamp and category prefix
# Matches: "19:36:12.310 CATEGORY (LEVEL): " or "19:36:12.310 CATEGORY : "
prefregex = ^\d{2}:\d{2}:\d{2}\.\d{3}\s+\S+(?:\s+\([EW]\))?\s*:\s*

# Option: failregex
# Notes.: Regex patterns to match failed/malicious activity
# Each line is a separate pattern that will trigger a failure count
#
# BattlEye events (IP in format: Player #N name (IP:port))
failregex = ^BattlEye Server: 'Player #\d+ \S+ \(<HOST>:\d+\) (?:kicked|banned)
            ^BattlEye Server: 'Player #\d+ \S+ \(<HOST>:\d+\).*(?:kicked|banned)
            ^BattlEye Server: .*<HOST>.*(?:Global Ban|kicked|banned)

            # RPL/Network authentication failures
            ^ServerImpl event: (?:auth(?:entication)?[ _]?fail|rejected|refused).*address=<HOST>:\d+
            ^ServerImpl event: connection[ _]?(?:rejected|refused|denied).*address=<HOST>:\d+

            # Anti-cheat violations (requires correlating player ID to IP separately)
            # These patterns catch direct IP mentions in anti-cheat logs
            ^\[TTT-ANTICHEAT\].*<HOST>.*(?:VIOLATION|CHEAT|HACK|EXPLOIT)
            ^\[TTT-AC\].*<HOST>.*(?:violation|cheat|hack|exploit)

            # Generic rejection patterns
            ^.*[Cc]onnection.*<HOST>.*(?:rejected|refused|denied|failed)
            ^.*[Aa]uthentication.*<HOST>.*(?:failed|rejected|invalid)
            ^.*<HOST>.*(?:kicked|banned) for (?:cheating|hacking|exploit)

            # RCON brute force attempts
            ^.*[Rr][Cc][Oo][Nn].*(?:failed|invalid|rejected).*<HOST>
            ^.*<HOST>.*[Rr][Cc][Oo][Nn].*(?:failed|invalid|rejected)

# Option: ignoreregex
# Notes.: Regex patterns to ignore (won't count as failures)
# Normal player disconnects and connections should not trigger bans
#
ignoreregex = ^BattlEye Server: 'Player #\d+ \S+ \(<HOST>:\d+\) connected'$
              ^BattlEye Server: 'Player #\d+ \S+ disconnected'$
              ^ServerImpl event: authenticating \(identity=.*, address=<HOST>:\d+\)$
              ^ServerImpl event: connected \(identity=
              ^ServerImpl event: connection timeout
              ^.*<HOST>.*disconnect(?:ed)? (?:gracefully|normally)

# Option: maxlines
# Notes.: Number of lines to buffer for multi-line matching
#
maxlines = 1

# Option: datepattern
# Notes.: Pattern to match the timestamp in log lines
# Format: HH:MM:SS.mmm (e.g., 19:36:12.310)
#
datepattern = ^%%H:%%M:%%S\.%%f
              {^LN-BEG}

[Init]

# Option: journalmatch
# Notes.: Match pattern for systemd journal (if using journald)
#
journalmatch = _SYSTEMD_UNIT=arma-reforger.service + _COMM=armareforger

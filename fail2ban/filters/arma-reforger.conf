# Fail2Ban Filter for Arma Reforger Dedicated Server
# Place this file in /etc/fail2ban/filter.d/arma-reforger.conf
#
# This filter catches malicious activity patterns from Arma Reforger server logs.
# Adjust the patterns based on your server's actual log format.

[Definition]

# Common prefixes that might appear before the log message
_daemon = armareforger|ArmaReforgerServer|reforger

# Option: prefregex
# Notes.: Prefix regex to match the timestamp and common prefix
prefregex = ^(?:\[.*?\])?\s*(?:<_daemon>:?)?\s*

# Option: failregex
# Notes.: Regex patterns to match failed/malicious activity
# Each line is a separate pattern that will trigger a failure count
#
failregex = ^Connection attempt from <HOST> rejected[:\s]
            ^<HOST> - Failed authentication[:\s]
            ^<HOST> - Invalid session token[:\s]
            ^<HOST> - Connection refused: too many attempts[:\s]
            ^<HOST> - Kicked for: (?:cheating|hacking|exploit)[:\s]
            ^<HOST> - Banned player attempted to connect[:\s]
            ^<HOST> - Invalid packet received[:\s]
            ^<HOST> - Protocol violation[:\s]
            ^<HOST> - Rate limit exceeded[:\s]
            ^Client <HOST> disconnected: kicked[:\s]
            ^Player from <HOST> was kicked[:\s]
            ^Rejecting connection from <HOST>[:\s]
            ^<HOST>.*(?:CHEAT|HACK|EXPLOIT).*detected[:\s]
            ^BattlEye:.*<HOST>.*(?:kicked|banned)[:\s]
            ^RCon: Failed login attempt from <HOST>[:\s]
            ^RCON authentication failed from <HOST>[:\s]

# Option: ignoreregex
# Notes.: Regex patterns to ignore (won't count as failures)
#
ignoreregex = ^<HOST> - Disconnected gracefully
              ^<HOST> - Connection closed by client
              ^<HOST> - Player left the game

# Option: maxlines
# Notes.: Number of lines to buffer for multi-line matching
#
maxlines = 1

# Option: datepattern
# Notes.: Pattern to match the timestamp in log lines
# Adjust based on your server's log format
#
datepattern = %%Y-%%m-%%d %%H:%%M:%%S
              %%Y/%%m/%%d %%H:%%M:%%S
              %%d/%%b/%%Y:%%H:%%M:%%S
              ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
              {^LN-BEG}

[Init]

# Option: journalmatch
# Notes.: Match pattern for systemd journal (if using journald)
#
journalmatch = _SYSTEMD_UNIT=arma-reforger.service + _COMM=armareforger

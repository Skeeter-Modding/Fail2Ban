# Fail2Ban Discord Action Configuration (curl version)
# Place this file in /etc/fail2ban/action.d/discord-curl.conf
#
# This is a simpler action that uses curl directly to send Discord webhooks.
# Use this if you don't want to install the Python dependencies.
#
# Requires: curl, jq (required for safe JSON encoding)
#
# Note: jq is used to safely escape values to prevent JSON injection.
# Install jq: apt-get install jq (Debian/Ubuntu) or yum install jq (RHEL/CentOS)

[Definition]

# Option: actionstart
# Notes.: Command executed when the jail starts.
# Values: CMD
#
actionstart = jq -n --arg name "<name>" --arg ts "$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)" \
              '{"embeds":[{"title":"Fail2Ban Jail Started","description":"Jail `\($name)` has been started.","color":39423,"timestamp":$ts,"footer":{"text":"Fail2Ban"}}]}' \
              | curl -s -H "Content-Type: application/json" -d @- "<webhook_url>"

# Option: actionstop
# Notes.: Command executed when the jail stops.
# Values: CMD
#
actionstop = jq -n --arg name "<name>" --arg ts "$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)" \
             '{"embeds":[{"title":"Fail2Ban Jail Stopped","description":"Jail `\($name)` has been stopped.","color":39423,"timestamp":$ts,"footer":{"text":"Fail2Ban"}}]}' \
             | curl -s -H "Content-Type: application/json" -d @- "<webhook_url>"

# Option: actioncheck
# Notes.: Command executed once before each actionban command.
# Values: CMD
#
actioncheck =

# Option: actionban
# Notes.: Command executed when banning an IP.
#         Uses jq to safely encode all values and prevent JSON injection.
# Values: CMD
#
actionban = jq -n --arg ip "<ip>" --arg name "<name>" --arg failures "<failures>" --arg ts "$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)" \
            '{"embeds":[{"title":"IP Banned","description":"An IP has been banned by Fail2Ban.","color":16711680,"fields":[{"name":"IP Address","value":"`\($ip)`","inline":true},{"name":"Jail","value":"`\($name)`","inline":true},{"name":"Failures","value":$failures,"inline":true}],"timestamp":$ts,"footer":{"text":"Fail2Ban"}}]}' \
            | curl -s -H "Content-Type: application/json" -d @- "<webhook_url>"

# Option: actionunban
# Notes.: Command executed when unbanning an IP.
#         Uses jq to safely encode all values and prevent JSON injection.
# Values: CMD
#
actionunban = jq -n --arg ip "<ip>" --arg name "<name>" --arg ts "$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)" \
              '{"embeds":[{"title":"IP Unbanned","description":"An IP has been unbanned.","color":65280,"fields":[{"name":"IP Address","value":"`\($ip)`","inline":true},{"name":"Jail","value":"`\($name)`","inline":true}],"timestamp":$ts,"footer":{"text":"Fail2Ban"}}]}' \
              | curl -s -H "Content-Type: application/json" -d @- "<webhook_url>"

[Init]

# Option: webhook_url
# Notes.: Discord webhook URL - REQUIRED
# Values: URL
#
webhook_url =

# Option: name
# Notes.: Jail name
# Values: string Default: default
#
name = default

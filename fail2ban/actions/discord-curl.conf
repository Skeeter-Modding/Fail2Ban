# Fail2Ban Discord Action Configuration (curl version)
# Place this file in /etc/fail2ban/action.d/discord-curl.conf
#
# This is a simpler action that uses curl directly to send Discord webhooks.
# Use this if you don't want to install the Python dependencies.
#
# Requires: curl, jq (optional, for JSON escaping)
#
# NOTE ON TIMESTAMP INJECTION:
# The timestamp field uses nested quotes to inject the current date into the JSON:
#   "timestamp":"'"$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)"'"
# This pattern works by:
#   1. Closing the JSON string with "'
#   2. Executing the shell command $(date ...)
#   3. Opening the JSON string again with '"
# While complex, this allows dynamic timestamp generation without external JSON tools.
# For better maintainability, consider using the Python-based action (discord.conf) instead.

[Definition]

# Option: actionstart
# Notes.: Command executed when the jail starts.
# Values: CMD
#
actionstart = curl -s -H "Content-Type: application/json" \
              -d '{"embeds":[{"title":"Fail2Ban Jail Started","description":"Jail `<name>` has been started.","color":39423,"timestamp":"'"$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)"'","footer":{"text":"Fail2Ban"}}]}' \
              "<webhook_url>"

# Option: actionstop
# Notes.: Command executed when the jail stops.
# Values: CMD
#
actionstop = curl -s -H "Content-Type: application/json" \
             -d '{"embeds":[{"title":"Fail2Ban Jail Stopped","description":"Jail `<name>` has been stopped.","color":39423,"timestamp":"'"$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)"'","footer":{"text":"Fail2Ban"}}]}' \
             "<webhook_url>"

# Option: actioncheck
# Notes.: Command executed once before each actionban command.
# Values: CMD
#
actioncheck =

# Option: actionban
# Notes.: Command executed when banning an IP.
# Values: CMD
#
actionban = curl -s -H "Content-Type: application/json" \
            -d '{"embeds":[{"title":"IP Banned","description":"An IP has been banned by Fail2Ban.","color":16711680,"fields":[{"name":"IP Address","value":"`<ip>`","inline":true},{"name":"Jail","value":"`<name>`","inline":true},{"name":"Failures","value":"<failures>","inline":true}],"timestamp":"'"$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)"'","footer":{"text":"Fail2Ban"}}]}' \
            "<webhook_url>"

# Option: actionunban
# Notes.: Command executed when unbanning an IP.
# Values: CMD
#
actionunban = curl -s -H "Content-Type: application/json" \
              -d '{"embeds":[{"title":"IP Unbanned","description":"An IP has been unbanned.","color":65280,"fields":[{"name":"IP Address","value":"`<ip>`","inline":true},{"name":"Jail","value":"`<name>`","inline":true}],"timestamp":"'"$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)"'","footer":{"text":"Fail2Ban"}}]}' \
              "<webhook_url>"

[Init]

# Option: webhook_url
# Notes.: Discord webhook URL - REQUIRED
# Values: URL
#
webhook_url =

# Option: name
# Notes.: Jail name
# Values: string Default: default
#
name = default

# Fail2Ban Discord Action Configuration
# Place this file in /etc/fail2ban/action.d/discord.conf
#
# This action sends notifications to Discord when IPs are banned/unbanned.
# It uses the webhook_notifier.py script for sending messages.

[Definition]

# Option: actionstart
# Notes.: Command executed when the jail starts.
# Values: CMD
#
actionstart = /usr/local/bin/fail2ban-discord-notify start --jail "<name>"

# Option: actionstop
# Notes.: Command executed when the jail stops.
# Values: CMD
#
actionstop = /usr/local/bin/fail2ban-discord-notify stop --jail "<name>"

# Option: actioncheck
# Notes.: Command executed once before each actionban command.
# Values: CMD
#
actioncheck =

# Option: actionban
# Notes.: Command executed when banning an IP.
# Values: CMD
#
actionban = /usr/local/bin/fail2ban-discord-notify ban --jail "<name>" --ip "<ip>" --matches "<matches>" --failures "<failures>"

# Option: actionunban
# Notes.: Command executed when unbanning an IP.
# Values: CMD
#
actionunban = /usr/local/bin/fail2ban-discord-notify unban --jail "<name>" --ip "<ip>"

[Init]

# Option: name
# Notes.: Jail name
# Values: string Default: default
#
name = default
